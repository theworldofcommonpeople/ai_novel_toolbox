name: ai_novel_toolbox
description: AI小说创作工具箱 - 手机端App，支持云端API与本地模型混合推理
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # 本地存储
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  # 加密存储
  flutter_secure_storage: ^9.0.0
  # 网络请求
  dio: ^5.4.0
  http: ^1.2.0
  # 本地模型推理
  flutter_llama: ^0.2.2
  # UI
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.0.3
  # 文件操作
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  screenshot: ^2.1.0
  # JSON序列化
  json_annotation: ^4.8.1
  # 工具
  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0
  # Canvas绘制（书名测试用）
  flutter_quill: ^9.3.3
  # 权限
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/cover_templates/